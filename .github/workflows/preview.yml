# Plan morning-digest § 3 and § 4. Saves /digest/2026-10-28 as one HTML file and deploys it
# to GitHub Pages. The page is never committed (ADR 0003): to take the marker off, delete the
# LANE_MARKER repo variable and run this again; it uploads over the same link.
name: preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - name: Save the page
        env:
          LANE_MARKER: ${{ vars.LANE_MARKER }}
          PORT: 8787
        run: |
          pnpm start &
          for i in $(seq 1 30); do curl -sf http://localhost:8787/health >/dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf http://localhost:8787/digest/2026-10-28 -o _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
